<style>
:root{color-scheme:dark}
html,body{background:#07080C;color:#E8EBF4}
body{padding-inline:16px;padding-block:24px 48px;font-family:"Exo 2","Segoe UI",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hint{font:11px "JetBrains Mono",ui-monospace,monospace;color:#5E6579;letter-spacing:.06em;text-align:center;margin:0}
.msg{font-size:13px;color:#8A91A6;min-height:1.4em;margin:0;text-align:center}
.msg.warn{color:#E3B54C}

.djp-wrap{container-type:inline-size}
.djp{--djp-bg:#07080C;--djp-panel:#0E1017;--djp-panel2:#141722;--djp-line:#232838;--djp-text:#E8EBF4;--djp-muted:#8A91A6;--djp-cyan:#00E5FF;--djp-violet:#8B5CFF;--djp-gold:#E3B54C;--djp-red:#FF5C7A;
  background:radial-gradient(120% 80% at 100% 0%,rgba(139,92,255,.16),transparent 60%),radial-gradient(90% 70% at 0% 100%,rgba(0,229,255,.08),transparent 60%),var(--djp-bg);
  color:var(--djp-text);font-family:"Exo 2","Segoe UI",system-ui,sans-serif;border:1px solid var(--djp-line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px;overflow:hidden;position:relative}
.djp *{box-sizing:border-box}
.djp-top{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center}
@container (min-width:600px){.djp-top{grid-template-columns:260px minmax(0,1fr);gap:24px}}
.djp-sleeve{position:relative;width:72%;max-width:260px;aspect-ratio:1}
@container (min-width:600px){.djp-sleeve{width:74%}}
.djp-disc{position:absolute;inset:3%;border-radius:50%;transition:transform .7s cubic-bezier(.2,.8,.2,1);z-index:0}
.djp.playing .djp-disc{transform:translateX(36%)}
.djp-grooves{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#0B0C11 0 1.5px,#191B24 1.5px 2.6px);box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 0 0 1px #2A2E3C}
.djp-grooves::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.07) 14%,transparent 20% 60%,rgba(255,255,255,.05) 64%,transparent 70%)}
.djp-lbl{position:absolute;inset:33%;border-radius:50%;background:var(--djp-panel2) center/cover no-repeat;box-shadow:0 0 0 3px #0B0C11}
.djp-lbl::after{content:"";position:absolute;left:50%;top:50%;width:8%;height:8%;margin:-4% 0 0 -4%;border-radius:50%;background:#050608}
.djp.playing .djp-grooves{animation:djp-spin 1.8s linear infinite}
@keyframes djp-spin{to{transform:rotate(360deg)}}
.djp-cover{position:relative;z-index:1;width:100%;height:100%;border-radius:6px;overflow:hidden;background:var(--djp-panel2);box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06)}
.djp-cover img{width:100%;height:100%;object-fit:cover;display:block}
.djp-cover .djp-noart{position:absolute;inset:0;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--djp-muted)}
.djp-meta{display:flex;flex-direction:column;gap:8px;min-width:0}
.djp-eyebrow{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--djp-cyan)}
.djp-title{font-family:"Bebas Neue","Oswald",Impact,sans-serif;font-weight:400;font-size:clamp(40px,11cqi,72px);line-height:.9;letter-spacing:.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.djp-artist{font-size:18px;font-weight:600;color:var(--djp-text);opacity:.9}
.djp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.djp-chip{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.06em;border:1px solid var(--djp-line);background:rgba(20,23,34,.8);border-radius:5px;padding:4px 8px;color:var(--djp-muted);font-variant-numeric:tabular-nums}
.djp-chip b{color:var(--djp-text);font-weight:600}
.djp-pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@container (min-width:520px){.djp-pads{grid-template-columns:repeat(4,minmax(0,1fr))}}
.djp-pad{--c:var(--djp-cyan);text-align:left;background:linear-gradient(180deg,#171A26,#10121A);border:1px solid var(--djp-line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--djp-text);display:flex;flex-direction:column;gap:2px;position:relative;transition:border-color .15s,box-shadow .15s,transform .1s}
.djp-pad:hover{border-color:#3A4260}
.djp-pad:active{transform:translateY(1px)}
.djp-pad[data-k="dirty"]{--c:var(--djp-red)}.djp-pad[data-k="inst"]{--c:var(--djp-violet)}.djp-pad[data-k="acap"]{--c:var(--djp-gold)}
.djp-pad .t{font-family:"Bebas Neue","Oswald",Impact,sans-serif;font-size:24px;letter-spacing:.06em;line-height:1;color:var(--c)}
.djp-pad .l{font-size:12px;color:var(--djp-muted)}
.djp-pad .d{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--djp-muted);font-variant-numeric:tabular-nums}
.djp-pad .led{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:#262A38}
.djp-pad.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset,0 0 22px -6px var(--c)}
.djp-pad.on .led{background:var(--c);box-shadow:0 0 8px var(--c)}
.djp-pad[disabled]{opacity:.38;cursor:not-allowed}
.djp-pad kbd{position:absolute;bottom:9px;right:10px;font-family:"JetBrains Mono",monospace;font-size:10px;color:#4A5066}
.djp-wave{position:relative;height:96px;border-radius:10px;background:#0A0B11;border:1px solid var(--djp-line);cursor:pointer;touch-action:none}
.djp-wave canvas{display:block;width:100%;height:100%}
.djp-tr{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.djp-play{width:54px;height:54px;border-radius:50%;border:0;background:var(--djp-cyan);color:#041014;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 24px -4px rgba(0,229,255,.7);flex:none}
.djp-play:hover{background:#5CF0FF}
.djp-play svg{width:22px;height:22px}
.djp-sm{border:1px solid var(--djp-line);background:transparent;color:var(--djp-text);border-radius:8px;padding:7px 10px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;cursor:pointer}
.djp-sm:hover{border-color:var(--djp-cyan);color:var(--djp-cyan)}
.djp-sm[aria-pressed="true"]{border-color:var(--djp-gold);color:var(--djp-gold)}
.djp-time{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px;display:flex;flex-direction:column;line-height:1.3;margin-right:auto}
.djp-time .bar{font-size:10.5px;color:var(--djp-muted);letter-spacing:.08em}
.djp-dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}

.djp-dla span{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--djp-muted);font-weight:400}
button.djp-dla{font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left;width:100%}
.djp-dla.all{border-color:var(--djp-cyan);color:var(--djp-cyan)}
.djp-dla[aria-busy="true"]{opacity:.6;pointer-events:none}
.djp-dla:hover{border-color:var(--djp-cyan)}
.djp-dla.off{opacity:.5;pointer-events:none}
.djp-sec{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--djp-muted);margin:0}
.djp-notes{font-size:14px;line-height:1.55;color:#C9CDDA;white-space:pre-line;max-width:65ch;margin:0}

.djp-about h2{font-family:"Bebas Neue","Oswald",Impact,sans-serif;font-weight:400;font-size:26px;letter-spacing:.05em;margin:0 0 6px;line-height:1}

.djp-tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

.djp-soc span{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:400;color:var(--djp-muted)}
.djp-soc:hover{border-color:var(--djp-cyan);color:var(--djp-cyan)}

  const all = pack.versions || [];
  const avail = all.filter(v => v.url);
  let cur = avail.find(v => v.id === st.vid) || avail[0] || null;
  let sync = st.sync !== false;
  const bpm = parseFloat(pack.bpm) || 0;
  const barDur = bpm ? 240 / bpm : 0;
  const rel = pack.release ? new Date(pack.release + 'T12:00:00') : null;
  const relTxt = rel && !isNaN(rel) ? rel.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}).toUpperCase() : '';

  const chips = [];
  if (bpm) chips.push('BPM <b>' + esc(+bpm.toFixed(1)) + '</b>');
  if (pack.keyName) chips.push('KEY <b>' + esc(pack.keyName) + (pack.camelot ? ' · ' + esc(pack.camelot) : '') + '</b>');
  if (pack.genre) chips.push('<b>' + esc(pack.genre) + '</b>');
  if (relTxt) chips.push('OUT <b>' + esc(relTxt) + '</b>');

  const playIco = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const pauseIco = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';

  root.innerHTML = `
  <div class="djp-wrap"><div class="djp">
    <div class="djp-top">
      <div class="djp-sleeve">
        <div class="djp-disc"><div class="djp-grooves"><div class="djp-lbl" style="${pack.art ? `background-image:url('${pack.art}')` : ''}"></div></div></div>
        <div class="djp-cover">${pack.art ? `<img src="${pack.art}" alt="${esc(pack.title)} artwork">` : '<div class="djp-noart">NO ARTWORK</div>'}</div>
      </div>
      <div class="djp-meta">
        <div class="djp-eyebrow">DJ Pack${pack.label ? ' · ' + esc(pack.label) : ''}</div>
        <h1 class="djp-title">${esc(pack.title || 'Untitled')}</h1>
        <div class="djp-artist">${esc(pack.artist || 'Artist')}</div>
        <div class="djp-chips">${chips.map(c => `<span class="djp-chip">${c}</span>`).join('')}</div>
      </div>
    </div>
    ${avail.length ? `
    <div class="djp-pads" role="group" aria-label="Versions">
      ${all.map((v, i) => `<button type="button" class="djp-pad" data-k="${v.id}" data-id="${v.id}" ${v.url ? '' : 'disabled'} aria-pressed="false">
        <span class="led"></span><span class="t">${esc(v.tag)}</span><span class="l">${esc(v.label)}</span>
        <span class="d">${v.url ? fmt(v.duration) : 'Not in pack'}</span>${opts.preview ? '' : `<kbd>${i + 1}</kbd>`}</button>`).join('')}
    </div>
    <div class="djp-wave" aria-label="Waveform, click to seek"><canvas></canvas></div>
    <div class="djp-tr">
      <button type="button" class="djp-play" aria-label="Play">${playIco}</button>
      <div class="djp-time"><span><span class="tc">0:00</span> / <span class="td">0:00</span></span><span class="bar">${bpm ? 'BAR 01 · 1' : ''}</span></div>
      ${bpm ? '<button type="button" class="djp-sm" data-jump="-1">−1 BAR</button><button type="button" class="djp-sm" data-jump="1">+1 BAR</button>' : ''}
      <button type="button" class="djp-sm djp-sync" aria-pressed="${sync}" title="Keep the playhead position when switching versions">SYNC SWITCH</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <p class="djp-sec">Downloads</p>
      <div class="djp-dl">
        ${pack.downloads && pack.downloads.length ? pack.downloads.map(d => `<a class="djp-dla" href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.label)}<span>${esc(d.fmt)} ↓</span></a>`).join('') : (() => `
        ${avail.map(v => opts.preview
          ? `<a class="djp-dla off" aria-disabled="true">${esc(v.label)}<span>${esc(v.ext || '').toUpperCase()}</span></a>`
          : opts.onDownload ? `<button type="button" class="djp-dla" data-dl="${v.id}">${esc(v.label)}<span>${esc(v.ext || '').toUpperCase()} ↓</span></button>`
          : `<a class="djp-dla" href="${v.url}" download="${esc(v.filename)}">${esc(v.label)}<span>${esc(v.ext || '').toUpperCase()} ↓</span></a>`).join('')}
        ${pack.art ? (opts.preview
          ? `<a class="djp-dla off" aria-disabled="true">Artwork<span>${esc(pack.artExt || 'IMG').toUpperCase()}</span></a>`
          : opts.onDownload ? `<button type="button" class="djp-dla" data-dl="art">Artwork<span>${esc(pack.artExt || 'IMG').toUpperCase()} ↓</span></button>`
          : `<a class="djp-dla" href="${pack.art}" download="${esc(pack.artFilename || 'artwork')}">Artwork<span>${esc(pack.artExt || 'IMG').toUpperCase()} ↓</span></a>`) : ''}
        ${opts.onDownload && !opts.preview ? `<button type="button" class="djp-dla all" data-dl="all">Full pack<span>ZIP ↓</span></button>` : ''}
`)()}
      </div>
    </div>` : '<div class="djp-empty">Upload at least one version to hear the player.</div>'}
    ${(() => {
      const tips = (pack.playIt || []).filter(Boolean), socs = (pack.socials || []).filter(x => x && /^https?:\/\//i.test(x.url));
      if (!pack.bio && !tips.length && !socs.length) return '';
      const side = (tips.length ? `<div><p class="djp-sec" style="margin-bottom:10px">Play it</p><ul class="djp-tips">${tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : '')
        + (socs.length ? `<div><p class="djp-sec" style="margin-bottom:10px">Follow</p><div class="djp-socs">${socs.map(x => `<a class="djp-soc" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.name)}${x.handle ? `<span>${esc(x.handle)}</span>` : ''}</a>`).join('')}</div></div>` : '');
      return `<div class="djp-about ${pack.bio && side ? 'two' : ''}">${pack.bio ? `<div><h2>About the record</h2><p class="djp-bio">${esc(pack.bio)}</p></div>` : ''}${side ? `<div class="djp-side">${side}</div>` : ''}</div>`;
    })()}
    ${pack.notes ? `<div style="display:flex;flex-direction:column;gap:6px"><p class="djp-sec">Notes for DJs</p><p class="djp-notes">${esc(pack.notes)}</p></div>` : ''}
    <div class="djp-foot"><span>${pack.contact ? 'CONTACT · ' + esc(pack.contact) : ''}</span><span>${pack.isrc ? 'ISRC ' + esc(pack.isrc) : ''}</span></div>
  </div></div>`;

  const djp = root.querySelector('.djp');
  if (!cur) return { getState: () => ({ sync }), destroy() {} };

  const audio = new Audio();
  audio.preload = 'auto';
  const cv = root.querySelector('canvas'), ctx = cv.getContext('2d');
  const wave = root.querySelector('.djp-wave');
  const playBtn = root.querySelector('.djp-play');
  const tc = root.querySelector('.tc'), td = root.querySelector('.td'), barEl = root.querySelector('.djp-time .bar');
  const css = getComputedStyle(djp);
  const C = { cyan: css.getPropertyValue('--djp-cyan').trim(), violet: css.getPropertyValue('--djp-violet').trim(), gold: css.getPropertyValue('--djp-gold').trim(), muted: '#2B3040', grid: 'rgba(138,145,166,.16)', gridStrong: 'rgba(138,145,166,.34)', label: '#5E6579' };
  let raf = 0, pendingSeek = null;

  const dur = () => (isFinite(audio.duration) && audio.duration) || cur.duration || 0;

  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
    if (!w) return;
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const D = dur(), t = audio.currentTime || 0, prog = D ? t / D : 0;
    // bar grid
    if (barDur && D) {
      ctx.font = '9px "JetBrains Mono", monospace';
      for (let b = 0; b * barDur < D; b++) {
        const x = Math.round(b * barDur / D * w) + .5;
        const phrase = b % 4 === 0;
        ctx.fillStyle = phrase ? C.gridStrong : C.grid;
        ctx.fillRect(x, phrase ? 0 : h - 10, 1, phrase ? h : 10);
        if (phrase && w / (D / barDur) * 4 > 26) { ctx.fillStyle = C.label; ctx.fillText(String(b + 1), x + 3, 10); }
      }
    }
    const peaks = cur.peaks || [];
    const step = 3, n = Math.floor(w / step), mid = h / 2 + 4;
    const g = ctx.createLinearGradient(0, 0, w, 0); g.addColorStop(0, C.cyan); g.addColorStop(1, C.violet);
    for (let i = 0; i < n; i++) {
      const p = peaks.length ? peaks[Math.min(peaks.length - 1, Math.floor(i / n * peaks.length))] : .12;
      const bh = Math.max(2, p * (h - 20));
      ctx.fillStyle = (i / n) <= prog ? g : C.muted;
      ctx.fillRect(i * step, mid - bh / 2, 2, bh);
    }
    const px = Math.round(prog * w);
    ctx.fillStyle = C.gold; ctx.fillRect(px - 1, 0, 2, h);
  }

  function ui() {
    const t = audio.currentTime || 0;
    tc.textContent = fmt(t); td.textContent = fmt(dur());
    if (barDur && barEl) {
      const bar = Math.floor(t / barDur) + 1, beat = Math.floor((t % barDur) / (barDur / 4)) + 1;
      barEl.textContent = 'BAR ' + String(bar).padStart(2, '0') + ' · ' + beat;
    }
    const playing = !audio.paused;
    djp.classList.toggle('playing', playing);
    playBtn.innerHTML = playing ? pauseIco : playIco;
    playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    root.querySelectorAll('.djp-pad').forEach(p => { const on = p.dataset.id === cur.id; p.classList.toggle('on', on); p.setAttribute('aria-pressed', on); });
    draw();
  }
  function loop() { ui(); if (!audio.paused) raf = requestAnimationFrame(loop); }

  function load(v, t, autoplay) {
    cur = v;
    pendingSeek = t || 0;
    audio.src = v.url;
    audio.addEventListener('loadedmetadata', function once() {
      audio.removeEventListener('loadedmetadata', once);
      if (pendingSeek) audio.currentTime = Math.min(pendingSeek, Math.max(0, audio.duration - .05));
      pendingSeek = null;
      ui();
    });
    if (autoplay) audio.play().catch(() => {}); else audio.load();
    ui();
  }
  function switchTo(id) {
    const v = avail.find(x => x.id === id); if (!v || v === cur) return;
    const playing = !audio.paused;
    load(v, sync ? audio.currentTime : 0, playing);
  }
  function toggle() { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); }
  function seekTo(t) { const D = dur(); audio.currentTime = Math.max(0, Math.min(D ? D - .05 : 0, t)); ui(); }

  audio.addEventListener('play', () => { cancelAnimationFrame(raf); loop(); });
  audio.addEventListener('pause', ui);
  audio.addEventListener('ended', ui);
  audio.addEventListener('durationchange', ui);

  playBtn.addEventListener('click', toggle);
  root.querySelectorAll('.djp-pad').forEach(p => p.addEventListener('click', () => switchTo(p.dataset.id)));
  root.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => seekTo((audio.currentTime || 0) + (+b.dataset.jump) * barDur)));
  if (opts.onDownload && !opts.preview) root.querySelectorAll('[data-dl]').forEach(b => b.addEventListener('click', () => opts.onDownload(b.dataset.dl, b)));
  const syncBtn = root.querySelector('.djp-sync');
  syncBtn.addEventListener('click', () => { sync = !sync; syncBtn.setAttribute('aria-pressed', sync); });

  let dragging = false;
  const seekFromEvent = e => { const r = wave.getBoundingClientRect(); seekTo(((e.clientX - r.left) / r.width) * dur()); };
  wave.addEventListener('pointerdown', e => { dragging = true; wave.setPointerCapture(e.pointerId); seekFromEvent(e); });
  wave.addEventListener('pointermove', e => { if (dragging) seekFromEvent(e); });
  wave.addEventListener('pointerup', () => { dragging = false; });

  let keyHandler = null;
  if (!opts.preview) {
    keyHandler = e => {
      if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); toggle(); }
      else if (/^[1-9]$/.test(e.key)) { const v = all[+e.key - 1]; if (v && v.url) switchTo(v.id); }
      else if (e.key === 'ArrowRight' && barDur) seekTo(audio.currentTime + barDur);
      else if (e.key === 'ArrowLeft' && barDur) seekTo(audio.currentTime - barDur);
    };
    document.addEventListener('keydown', keyHandler);
  }

  const ro = new ResizeObserver(() => draw());
  ro.observe(wave);

  load(cur, st.t || 0, !!st.playing);

  return {
    getState: () => ({ vid: cur && cur.id, t: audio.currentTime || 0, playing: !audio.paused, sync }),
    destroy() { cancelAnimationFrame(raf); audio.pause(); audio.removeAttribute('src'); audio.load(); ro.disconnect(); if (keyHandler) document.removeEventListener('keydown', keyHandler); }
  };
}

const BASE="Big Angie - Trap Queen";
const msg=document.getElementById('msg');
const say=(t,w)=>{msg.textContent=t;msg.className='msg'+(w?' warn':'');};
async function blobOf(url){const r=await fetch(url);if(!r.ok)throw new Error('File not found');return r.blob();}
async function onDownload(id,btn){
  const dl=null; // downloads are served from Drive links above
  if(!dl){say("Downloads aren't available in this view.",true);return;}
  btn.setAttribute('aria-busy','true');
  try{
    let filename,data;
    if(id==='art'){say('Packing artwork…');const z=new JSZip();z.file(BASE+' (Cover Art).png',await blobOf('cover.png'));z.file(BASE+' (Vertical Art 9x16).png',await blobOf('vertical.png'));data=await z.generateAsync({type:'blob',compression:'STORE'});filename=BASE+' (Artwork).zip';}
    else{
      const list=id==='all'?PACK.versions:PACK.versions.filter(v=>v.id===id);
      say(id==='all'?'Packing all versions…':'Preparing '+list[0].label+'…');
      const zip=new JSZip();
      for(const v of list)zip.file(v.filename,await blobOf(v.url));
      if(id==='all'){zip.file(BASE+' (Cover Art).png',await blobOf('cover.png'));zip.file(BASE+' (Vertical Art 9x16).png',await blobOf('vertical.png'));}
      data=await zip.generateAsync({type:'blob',compression:'STORE'});
      filename=id==='all'?BASE+' (DJ Pack).zip':list[0].filename.replace(/\.mp3$/,'.zip');
    }
    say('Confirm the save…');
    await dl.save({filename,data});
    say('Saved '+filename);
  }catch(e){
    const c=e&&e.code;
    say(c==='declined'?'Save cancelled.':c==='rate_limited'?'A save prompt is already open.':'Download failed: '+(e&&e.message||'unknown error'),c!=='declined');
  }finally{btn.removeAttribute('aria-busy');}
}
mountPlayer(document.getElementById('app'),PACK,{preview:false,onDownload});
</script>
