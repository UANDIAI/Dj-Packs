<style>
:root{color-scheme:dark}
html,body{background:#0B0608;color:#F1E9E0}
body{padding-inline:16px;padding-block:24px 48px;font-family:"Exo 2","Segoe UI",system-ui,sans-serif}
main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hint{font:11px "JetBrains Mono",ui-monospace,monospace;color:#6E5A4E;letter-spacing:.06em;text-align:center;margin:0}

.al-wrap{container-type:inline-size}
.al{--bg:#0B0608;--panel:#140A0D;--panel2:#1C0F13;--line:#3A2228;--line2:#4A2C33;--text:#F1E9E0;--muted:#A8927F;--dim:#6E5A4E;--gold:#E3B54C;--gold2:#F4D27A;--wine:#8B1E2D;--rose:#C94B5A;
  background:radial-gradient(120% 80% at 100% 0%,rgba(139,30,45,.35),transparent 60%),radial-gradient(90% 70% at 0% 100%,rgba(227,181,76,.10),transparent 60%),var(--bg);
  color:var(--text);font-family:"Exo 2","Segoe UI",system-ui,sans-serif;border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:22px;overflow:hidden;position:relative}
.al *{box-sizing:border-box}
.al-hero{position:relative;margin:-22px -22px 0;background:#0A0607}

.al-meta .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.al-disc{position:relative;flex:none;width:44px;height:44px;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#0A0708 0 1.5px,#1E1416 1.5px 2.6px);box-shadow:0 6px 16px rgba(0,0,0,.6),inset 0 0 0 1px #3A2228;opacity:.0;transition:opacity .4s}
.al.playing .al-disc{opacity:1;animation:al-spin 1.8s linear infinite}
.al-disc::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #0A0708}

.al-meta{display:flex;flex-direction:column;gap:8px;min-width:0}
.al-eyebrow{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#FFFFFF;display:inline-flex;align-self:flex-start;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-shadow:0 1px 8px rgba(0,0,0,.9);white-space:nowrap;max-width:100%}
@media(max-width:430px){.al-eyebrow{font-size:10.5px;letter-spacing:.13em;padding:6px 10px}}
.al-title{font-family:"Cormorant Garamond","Times New Roman",serif;font-weight:600;font-size:clamp(44px,7.5cqi,72px);line-height:.9;letter-spacing:.08em;margin:0;color:var(--gold2);text-shadow:0 2px 24px rgba(0,0,0,.8),0 0 28px rgba(227,181,76,.25)}
.al-artist{font-size:18px;font-weight:600;color:var(--text);opacity:.95;text-shadow:0 1px 12px rgba(0,0,0,.8)}

.al-sub{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:19px;color:#E6D8C8;text-shadow:0 1px 12px rgba(0,0,0,.8)}
.al-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.al-chip{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.06em;border:1px solid var(--line);background:rgba(28,15,19,.85);border-radius:5px;padding:4px 8px;color:var(--muted);font-variant-numeric:tabular-nums}
.al-chip b{color:var(--text);font-weight:600}

.al-sec{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.al-list{display:flex;flex-direction:column;gap:6px}
.al-tr{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;text-align:left;background:linear-gradient(180deg,#1B1013,#130A0D);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--text);font:inherit;position:relative;transition:border-color .15s,box-shadow .15s}
.al-tr:hover,.al-tr:focus-visible{border-color:var(--line2);outline:none}
.al-tr.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 24px -8px var(--gold)}
.al-tr .n{font-family:"Bebas Neue",Impact,sans-serif;font-size:24px;letter-spacing:.04em;color:var(--dim);line-height:1}
.al-tr.on .n{color:var(--gold)}
.al-tr .t{font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.al-tr .f{display:block;font-size:12px;color:var(--muted);font-weight:500}
.al-tr .k{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.al-tr .k b{color:var(--text);font-weight:600}
.al-tr .d{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.al-tr .pl{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.al-tr .pl i{display:inline-block;width:0;height:0;border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;opacity:.85}
.al-tr .pl[hidden]{display:none}
@media(max-width:430px){.al-tr .d{display:none}}
.al-chip.streams b{color:var(--gold2)}
.al-tr .k2{display:none}
@container (min-width:560px){.al-tr .k2{display:inline}}
.al-tr .st{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--gold);flex:none}
.al-tr.on .st{background:var(--gold);color:#1A0E05;border-color:var(--gold)}
.al-tr .st svg{width:12px;height:12px}

.al-tr .tip svg{width:13px;height:13px}
.al-tr .tip:hover,.al-tr .tip:focus-visible{background:var(--gold);color:#1A0E05;border-color:var(--gold);outline:none}
@media(max-width:430px){.al-tr{padding:10px 10px;gap:8px}}
.al-tipnow{border-color:rgba(227,181,76,.6)!important;color:var(--gold)!important;background:rgba(227,181,76,.08)!important;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.al-tipnow svg{width:13px;height:13px}
.al-tipnow:hover{background:var(--gold)!important;color:#1A0E05!important}
.al-jar{border:1px solid rgba(227,181,76,.45);border-radius:12px;padding:18px 18px;background:radial-gradient(120% 140% at 0% 0%,rgba(139,30,45,.38),rgba(20,10,13,.92) 60%);display:grid;grid-template-columns:minmax(0,1fr);gap:14px;position:relative;overflow:hidden}
.al-jar::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:1px solid rgba(227,181,76,.18);box-shadow:0 0 0 24px rgba(227,181,76,.05),0 0 0 48px rgba(227,181,76,.03);pointer-events:none}
@container (min-width:680px){.al-jar{grid-template-columns:minmax(0,1fr) auto;align-items:center}.al-jar .al-fl{grid-column:1/-1}}
.al-dj{border:1px solid rgba(201,75,90,.45);border-radius:12px;padding:18px;background:radial-gradient(120% 140% at 100% 0%,rgba(139,30,45,.42),rgba(20,10,13,.94) 60%);display:grid;grid-template-columns:minmax(0,1fr);gap:14px;position:relative;overflow:hidden}
.al-dj h3{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:28px;letter-spacing:.03em;margin:0 0 6px;line-height:1;color:var(--gold2)}
.al-dj p{margin:0;font-size:13.5px;line-height:1.5;color:#DCCFC2;max-width:60ch}
.al-dj .al-sec{color:var(--rose);margin-bottom:8px}
.al-djf{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@container (min-width:560px){.al-djf{grid-template-columns:repeat(2,minmax(0,1fr))}.al-djf .wide,.al-djf .act{grid-column:1/-1}}
.al-djf label{display:flex;flex-direction:column;gap:5px;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.al-djf input{font:15px "Exo 2","Segoe UI",system-ui,sans-serif;color:var(--text);background:rgba(11,6,8,.8);border:1px solid var(--line2);border-radius:8px;padding:11px 12px;outline:none;min-width:0;width:100%;box-sizing:border-box}
.al-djf input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,181,76,.15)}
.al-djf input.bad{border-color:var(--rose)}
.al-djf .act{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.al-djf .fine{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em;color:var(--dim);margin:0}
.al-djf .err{font-size:13px;color:var(--rose);margin:0;font-weight:600}
.al-dj .done{display:flex;gap:12px;align-items:center;border:1px solid var(--gold);background:rgba(227,181,76,.1);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.4}
.al-dj .done svg{width:22px;height:22px;color:var(--gold);flex:none}
.al-dj .done b{color:var(--gold2)}
.al-jar .djhint{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.08em;color:var(--muted);margin:2px 0 0}
.al-jar .djhint a{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(227,181,76,.4)}
.al-share{border:1px solid var(--line);border-radius:12px;padding:18px;background:linear-gradient(180deg,rgba(28,15,19,.9),rgba(14,8,10,.95));display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@container (min-width:640px){.al-share{grid-template-columns:minmax(0,1fr) 190px;align-items:start}}
.al-share h3{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:28px;letter-spacing:.03em;margin:0 0 6px;line-height:1;color:var(--gold2)}
.al-share p{margin:0;font-size:13.5px;line-height:1.5;color:#DCCFC2;max-width:60ch}
.al-share .al-sec{color:var(--gold);margin-bottom:8px}
.al-shbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.al-shbtns .al-sm{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.al-qr{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.al-qr a.img{display:block;background:#fff;border-radius:12px;padding:8px;line-height:0;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.al-qr img{width:150px;height:150px;display:block}
.al-qr small{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--muted)}
.al-qr .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.al-chip.share{border-color:var(--gold);color:var(--gold);cursor:pointer;background:rgba(227,181,76,.08)}
.al-fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;position:relative}
.al-dla.got{border-color:rgba(227,181,76,.55);color:var(--gold2)}
.al-dla.got span{color:var(--gold)}
.al-dla.lock span{color:var(--muted)}
.al-dla.lock:hover span{color:var(--gold)}
.al-tr .tip.got{background:var(--gold);color:#1A0E05;border-color:var(--gold);text-decoration:none}
.al-thanks .al-sm{margin-left:auto;flex:none;border-color:var(--gold);color:var(--gold);text-decoration:none;display:inline-flex;align-items:center}
.al-thanks{flex-wrap:wrap}
.al-thanks>div{flex:1 1 220px}
.al-jar h3{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:28px;letter-spacing:.03em;margin:0 0 6px;line-height:1;color:var(--gold2)}
.al-jar p{margin:0;font-size:13.5px;line-height:1.5;color:#DCCFC2;max-width:60ch}
.al-jar .al-sec{color:var(--gold);margin-bottom:8px}
.al-jarbtns{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.al-gold{border:0;background:var(--gold);color:#1A0E05;border-radius:999px;padding:12px 16px;font-family:"JetBrains Mono",monospace;font-size:11.5px;font-weight:600;letter-spacing:.1em;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:0 0 24px -6px rgba(227,181,76,.7);white-space:nowrap}
.al-gold:hover{background:var(--gold2)}
.al-gold svg{width:14px;height:14px}
.al-thanks{display:flex;gap:12px;align-items:center;border:1px solid var(--gold);background:linear-gradient(90deg,rgba(227,181,76,.18),rgba(139,30,45,.25));border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.4;color:#F1E9E0}
.al-thanks b{color:var(--gold2)}
.al-thanks svg{width:22px;height:22px;color:var(--gold);flex:none}
.al-sheet{--gold:#E3B54C;--gold2:#F4D27A;--line2:#4A2C33;--muted:#A8927F;--dim:#6E5A4E;--text:#F1E9E0;position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(5,2,3,.74);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:0;font-family:"Exo 2","Segoe UI",system-ui,sans-serif}

.al-sheet .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;display:grid;place-items:center}
.al-sheet .x:hover{color:var(--gold);border-color:var(--gold)}

.al-sheet .song{font-weight:600;font-size:15px;margin:0 0 8px}

  }
  audio.addEventListener('loadstart', refreshNowBtn);

  // ---- Tip jar: per-song tips through Stripe Payment Links (no server needed)
  var sheet = null; let tipTarget = null;
  const tipRef = t => ((DN && DN.refPrefix) || 'tip') + '-' + (t ? t.id : 'album');
  const tipUrl = (base, ref) => base + (base.includes('?') ? '&' : '?') + 'client_reference_id=' + encodeURIComponent(ref.replace(/[^A-Za-z0-9_-]/g, '-').slice(0, 200));
  const wired = () => !!(DN && (DN.customUrl || (DN.presets || []).some(p => p.url)));
  function buildSheet() {
    sheet = document.createElement('div'); sheet.className = 'al-sheet'; sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'true'); sheet.setAttribute('aria-label', 'Tip jar');
    const demo = !wired();
    const presets = (DN.presets || []).map((p, i) => ({ ...p, i })).filter(p => demo || p.url);
    sheet.innerHTML = `<div class="card"><button type="button" class="x" aria-label="Close">×</button><p class="eye"></p><h3>${esc(DN.title)}</h3><p class="song"></p><p class="b"></p>
      <div class="al-amts">${presets.map(p => `<button type="button" class="al-amt" data-p="${p.i}"><b>$${esc(p.amount)}</b><span>${esc(p.label)}</span></button>`).join('')}
      ${(demo || DN.customUrl) ? `<button type="button" class="al-amt custom" data-p="custom"><b>${esc(DN.customLabel || 'Name your number')}</b><span>ANY AMOUNT →</span></button>` : ''}</div>
      <p class="fine">${esc(DN.fine || '')}</p></div>`;
    document.body.appendChild(sheet);
    sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
    sheet.querySelector('.x').addEventListener('click', closeSheet);
    sheet.querySelectorAll('.al-amt').forEach(b => b.addEventListener('click', () => goTip(b.dataset.p)));
  }
  function openSheet(t) {
    if (!DN) return; if (!sheet) buildSheet(); tipTarget = t;
    sheet.querySelector('.eye').textContent = t ? 'Unlock · ' + nn(t) + ' ' + t.title : 'Unlock · the whole album';
    sheet.querySelector('.song').textContent = (t ? t.title + (t.feat ? ' feat. ' + t.feat : '') : pack.title + ' · all ' + tracks.length + ' songs + both covers') + ' · ' + pack.artist;
    sheet.querySelector('.b').textContent = t ? (DN.blurb || '') : (DN.blurbAlbum || DN.blurb || '');
    sheet.classList.add('open'); document.body.style.overflow = 'hidden';
    const f = sheet.querySelector('.al-amt'); if (f) f.focus();
  }
  function closeSheet() { if (!sheet) return; sheet.classList.remove('open'); document.body.style.overflow = ''; }
  function goTip(p) {
    const preset = p === 'custom' ? null : (DN.presets || [])[+p];
    const base = (preset && preset.url) || DN.customUrl || '';
    const ref = tipRef(tipTarget);
    closeSheet();
    if (!base) { say('The tip jar isn\'t wired to Stripe yet. Soon.', true); return; }
    try { localStorage.setItem('djpack.tip', JSON.stringify({ ref, id: tipTarget ? tipTarget.id : 'album', amount: preset ? preset.amount : null, at: Date.now() })); } catch (e) {}
    const u = tipUrl(base, ref);
    say('Taking you to Stripe for ' + (tipTarget ? tipTarget.title : 'the whole album') + '. You\'ll land right back here.');
    if (audio && !audio.paused) audio.pause();
    location.href = u;
  }
  // one delegated handler: GET buttons, file rows, album button, zip
  root.addEventListener('click', e => {
    const tip = e.target.closest('[data-tip]'); if (tip) { e.stopPropagation(); openSheet(tracks[+tip.dataset.tip]); return; }
    const got = e.target.closest('.tip.got'); if (got) { e.stopPropagation(); return; }
    const now = e.target.closest('[data-tipnow]'); if (now) { if (isUnlocked(cur)) { const a = document.createElement('a'); a.href = cur.url; a.download = cur.filename; document.body.appendChild(a); a.click(); a.remove(); say('Downloading ' + cur.title + '.'); } else openSheet(cur); return; }
    const alb = e.target.closest('[data-tipalbum]'); if (alb) { openSheet(null); return; }
    const zip = e.target.closest('[data-zip]'); if (zip) { if (DN && !unlocked.has('album')) { openSheet(null); return; } buildZip(zip); return; }
  });
  refreshLocks();

  // ---- DJ pack request: posts into a Google Form (lands in a Sheet), then unlocks the pack
  const LS_DJ = 'djpack.dj.' + (pack.slug || 'repeat');
  function djRender() {
    const body = root.querySelector('#al-djbody'); if (!body || !DJ) return;
    let saved = null; try { saved = JSON.parse(localStorage.getItem(LS_DJ) || 'null'); } catch (e) {}
    if (saved && saved.name) {
      body.innerHTML = `<div class="done">${heartIco}<div><b>${esc(DJ.doneTitle || 'Pack unlocked.')}</b> ${esc((DJ.doneCopy || 'Welcome aboard, {name}. Your downloads are open above.').replace('{name}', saved.name))} <a href="#al-files" data-djfiles style="color:var(--gold)">${esc(DJ.doneLink || 'Go to the files →')}</a></div></div>`;
      return;
    }
    body.innerHTML = `<form class="al-djf" novalidate>
      <label>${esc(DJ.nameLabel || 'DJ name')}<input name="name" autocomplete="name" placeholder="${esc(DJ.namePh || 'DJ Whoever')}" required></label>
      <label>${esc(DJ.phoneLabel || 'Phone')}<input name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="${esc(DJ.phonePh || '(314) 555-0199')}" required></label>
      <label class="wide">${esc(DJ.emailLabel || 'Email')}<input name="email" type="email" autocomplete="email" inputmode="email" placeholder="${esc(DJ.emailPh || 'you@yourcrew.com')}" required></label>
      <label class="wide">${esc(DJ.whereLabel || 'Where do you spin? (optional)')}<input name="where" placeholder="${esc(DJ.wherePh || 'City · club · radio · online')}"></label>
      <div class="act"><button type="submit" class="al-gold">${coinIco.replace('<svg', '<svg style="display:none"')}${esc(DJ.button || 'SEND ME THE PACK')}</button><p class="err" aria-live="polite"></p></div>
      <p class="fine wide">${esc(DJ.fine || '')}</p>
    </form>`;
    const f = body.querySelector('form');
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const v = k => (f.elements[k].value || '').trim();
      const name = v('name'), phone = v('phone'), email = v('email'), where = v('where');
      const err = f.querySelector('.err'); let bad = null;
      f.querySelectorAll('input').forEach(i => i.classList.remove('bad'));
      if (name.length < 2) bad = ['name', DJ.errName || 'Give us a name to put on the list.'];
      else if (phone.replace(/\D/g, '').length < 7) bad = ['phone', DJ.errPhone || 'That phone number is a little short.'];
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) bad = ['email', DJ.errEmail || 'That email doesn\u2019t look right.'];
      if (bad) { f.elements[bad[0]].classList.add('bad'); f.elements[bad[0]].focus(); err.textContent = bad[1]; return; }
      err.textContent = '';
      const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = DJ.sending || 'SENDING…';
      const fd = new URLSearchParams();
      fd.append(DJ.fields.name, name); fd.append(DJ.fields.phone, phone); fd.append(DJ.fields.email, email);
      if (DJ.fields.where) fd.append(DJ.fields.where, where || '');
      try {
        await fetch(DJ.action, { method: 'POST', mode: 'no-cors', body: fd });
        try { localStorage.setItem(LS_DJ, JSON.stringify({ name, at: Date.now() })); } catch (e) {}
        if ((DJ.deliver || 'instant') === 'instant') { unlocked.add('album'); saveUnlocked(); refreshLocks(); }
        djRender();
        say((DJ.toast || 'Pack unlocked for {name}. Downloads are open.').replace('{name}', name));
        const fl = root.querySelector('#al-files'); if (fl) fl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } catch (ex) {
        btn.disabled = false; btn.textContent = DJ.button || 'SEND ME THE PACK';
        err.textContent = DJ.errSend || 'Couldn\u2019t send that. Check your signal and try again.';
      }
    });
  }
  djRender();

  // ---- share kit
  const shText = () => (SH.text || (pack.title + ' by ' + pack.artist)).replace('{url}', SH.url);
  const copyLink = async hint => { try { await navigator.clipboard.writeText(SH.url); say(hint === 'ig' ? (SH.igHint || 'Link copied. Paste it in your bio, story or caption.') : 'Link copied.'); } catch (e) { prompt('Copy this link', SH.url); } };
  async function nativeShare() {
    if (navigator.share) { try { await navigator.share({ title: pack.title + ' · ' + pack.artist, text: shText(), url: SH.url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    const el = root.querySelector('#al-share'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); copyLink();
  }
  async function shareQr() {
    try {
      const r = await fetch(SH.qr); const blob = await r.blob(); const file = new File([blob], SH.qrFilename || 'qr.png', { type: blob.type || 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: pack.title, text: shText() + ' ' + SH.url }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = SH.qr; a.download = SH.qrFilename || 'qr.png'; document.body.appendChild(a); a.click(); a.remove(); say('QR saved. Send it anywhere; a phone camera opens the page.');
  }
  const enc = encodeURIComponent;
  root.querySelectorAll('[data-sh]').forEach(a => {
    const t = shText(), u = SH.url;
    a.href = { sms: 'sms:?&body=' + enc(t + ' ' + u), wa: 'https://wa.me/?text=' + enc(t + ' ' + u), fb: 'https://www.facebook.com/sharer/sharer.php?u=' + enc(u), x: 'https://twitter.com/intent/tweet?text=' + enc(t) + '&url=' + enc(u), mail: 'mailto:?subject=' + enc(pack.title + ' · ' + pack.artist) + '&body=' + enc(t + '\n\n' + u) }[a.dataset.sh] || u;
  });
  root.addEventListener('click', e => {
    if (e.target.closest('[data-share]')) nativeShare();
    else if (e.target.closest('[data-shareqr]')) shareQr();
    else { const c = e.target.closest('[data-copy]'); if (c) copyLink(c.dataset.hint); }
  });
  root.addEventListener('click', e => {
    const go = e.target.closest('[data-djgo],[data-djfiles]'); if (!go) return;
    e.preventDefault(); const el = root.querySelector(go.getAttribute('href')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  load(cur, 0, false);
}
mountAlbum(document.getElementById('app'), PACK);
</script>
</body>
</html>
