  root.addEventListener('click', e => {
    const go = e.target.closest('[data-djgo],[data-djfiles]'); if (!go) return;
    e.preventDefault(); const el = root.querySelector(go.getAttribute('href')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // ---- accordion: fold the four sections into tabs so the music comes first
  const ACC = [
    { id: 'share', sel: '#al-share', label: 'Share It', tease: (RF && RF.tease) || 'Send a song, earn a free download. Seven friends, the whole album.' },
    { id: 'own', sel: '#al-own', label: 'Own It', tease: 'Listening is free. Name your price for the files.' },
    { id: 'dj', sel: '#al-dj', label: 'DJ Request It', tease: 'Working DJs: the full pack, free, in exchange for a hello.' },
    { id: 'about', sel: '.al-about', label: 'About The Album', tease: 'The story behind the record and how to listen to it.' },
  ];
  (function buildAcc() {
    const first = root.querySelector(ACC[0].sel); if (!first) return;
    const wrap = document.createElement('div'); wrap.className = 'al-accs'; first.parentNode.insertBefore(wrap, first);
    ACC.forEach((a, i) => {
      const el = root.querySelector(a.sel); if (!el) return;
      const sec = document.createElement('section'); sec.className = 'al-acc'; sec.dataset.acc = a.id;
      sec.innerHTML = `<button type="button" class="al-accbtn" aria-expanded="false"><span class="n">0${i + 1}</span><span class="t"><b>${esc(a.label)}</b><span>${esc(a.tease)}</span><span class="mini" hidden></span></span><span class="ch"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></button><div class="al-accbody"><div></div></div>`;
      sec.querySelector('.al-accbody > div').appendChild(el); wrap.appendChild(sec);
    });
    // the old "al-about" heading grid loses its outer spacing inside a panel
    wrap.addEventListener('click', e => { const b = e.target.closest('.al-accbtn'); if (!b) return; const sec = b.parentNode; openAcc(sec.dataset.acc, !sec.classList.contains('open')); });
  })();
  function openAcc(id, open = true, scroll = true) {
    root.querySelectorAll('.al-acc').forEach(sec => { const on = sec.dataset.acc === id && open; sec.classList.toggle('open', on); sec.querySelector('.al-accbtn').setAttribute('aria-expanded', on ? 'true' : 'false'); });
    if (open && scroll) { const sec = root.querySelector('.al-acc[data-acc="' + id + '"]'); if (sec) setTimeout(() => sec.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60); }
  }
  function refMini() {
    const m = root.querySelector('.al-acc[data-acc="share"] .mini'); if (!m || !RF || !myRef) return;
    const n = refN(refRows()), t2 = RF.tier2 || 7; m.hidden = false; m.innerHTML = `<i style="--w:${Math.min(100, n / t2 * 100)}%"></i>${n} OF ${t2} FRIENDS LISTENED`;
  }
  refMini();
  // open the tab the visit is about; otherwise everything stays folded
  if (arriveMsg) openAcc('share', true, false);
  else if (thanksMsg) openAcc('own', true, false);
  // anchors inside the page open their panel first
  root.addEventListener('click', e => { const a = e.target.closest('[data-djgo],[data-djfiles]'); if (!a) return; const h = a.getAttribute('href'); openAcc(h === '#al-dj' ? 'dj' : 'own', true, false); }, true);
  const _openSheetFiles = root.querySelector('#al-files');
  load(cur, 0, false);
}
mountAlbum(document.getElementById('app'), PACK);
</script>
