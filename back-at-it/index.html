    r.addEventListener('click', () => pick(+r.dataset.i, true));

  let dragging = false;
  const seekFromEvent = e => { const r = wave.getBoundingClientRect(); seekTo(((e.clientX - r.left) / r.width) * dur()); };
  wave.addEventListener('pointerdown', e => { dragging = true; wave.setPointerCapture(e.pointerId); seekFromEvent(e); });
  wave.addEventListener('pointermove', e => { if (dragging) seekFromEvent(e); });
  wave.addEventListener('pointerup', () => { dragging = false; });

    if (sheet && sheet.classList.contains('open')) { if (e.key === 'Escape') closeSheet(); return; }

    else if (/^[1-9]$/.test(e.key)) pick(+e.key - 1, true);

  const msg = document.getElementById('msg');
  const say = (t, w) => { msg.textContent = t; msg.className = 'msg' + (w ? ' warn' : ''); };
  async function buildZip(zipBtn) {
    if (typeof JSZip === 'undefined') { say('ZIP isn\'t available here; use the single-track links.', true); return; }
    if (zipBtn) zipBtn.setAttribute('aria-busy', 'true');
    try {
      const zip = new JSZip(); let n = 0;
      for (const t of tracks) { say('Packing ' + (++n) + ' of ' + tracks.length + '…'); const r = await fetch(t.url); if (!r.ok) throw new Error(t.title + ' is missing'); zip.file(t.filename, await r.blob()); }
      for (const [u, f] of [[pack.frontUrl, pack.frontFilename], [pack.backUrl, pack.backFilename]]) { const r = await fetch(u); if (r.ok) zip.file(f, await r.blob()); }
      const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = pack.zipFilename; document.body.appendChild(a); a.click(); a.remove();

  // ---- lock/unlock rendering

  // ---- Tip jar: per-song tips through Stripe Payment Links (no server needed)

  function goTip(p) {

  // one delegated handler: GET buttons, file rows, album button, zip
  root.addEventListener('click', e => {

  // ---- DJ pack request: posts into a Google Form (lands in a Sheet), then unlocks the pack

  function djRender() {
    const body = root.querySelector('#al-djbody'); if (!body || !DJ) return;

    if (saved && saved.name) {
      body.innerHTML = `<div class="done">${heartIco}<div><b>${esc(DJ.doneTitle || 'Pack unlocked.')}</b> ${esc((DJ.doneCopy || 'Welcome aboard, {name}. Your downloads are open above.').replace('{name}', saved.name))} <a href="#al-files" data-djfiles style="color:var(--gold)">${esc(DJ.doneLink || 'Go to the files →')}</a></div></div>`;

    const f = body.querySelector('form');

  function applyRefRewards(n) {

    else status = `<p>${esc((RF.progress || '{n} of {t1} friends have pressed play. {left} more and you pick a free song.').replace('{n}', n).replace('{t1}', t1).replace('{left}', t1 - n))}</p>`;

    window[cb] = res => { try { const rows = (res.table.rows || []).map(r => r.c[0] && r.c[0].v).filter(Boolean); lsSet('refrows', JSON.stringify(rows)); } catch (e) {} delete window[cb]; sc.remove(); renderRef(); };
    const sc = document.createElement('script');
    sc.src = 'https://docs.google.com/spreadsheets/d/' + RF.sheetId + '/gviz/tq?tqx=out:json;responseHandler:' + cb + '&sheet=' + encodeURIComponent(RF.sheet || 'Form Responses 1') + '&tq=' + encodeURIComponent("select B where B starts with '" + myRef + "|'") + '&_=' + Date.now();
    sc.onerror = () => { delete window[cb]; sc.remove(); renderRef(); };
    document.head.appendChild(sc);
  }
  function creditReferrer(t) {
    if (!RF) return; let by = null; try { by = JSON.parse(lsGet('refby') || 'null'); } catch (e) {}
    if (!by || !by.ref || lsGet('refcredited')) return;
    let vid = lsGet('vid'); if (!vid) { vid = 'v' + Math.random().toString(36).slice(2, 10); lsSet('vid', vid); }
    lsSet('refcredited', '1');
    try { const fd = new URLSearchParams(); fd.append(RF.field, by.ref + '|' + t.id + '|' + vid); fetch(RF.action, { method: 'POST', mode: 'no-cors', body: fd, keepalive: true }).catch(() => {}); } catch (e) {}
    say(RF.credited || 'That play just counted for the friend who sent you here.');
  }
  root.addEventListener('click', e => { const b = e.target.closest('[data-refpick]'); if (!b) return; lsSet('refpick', b.dataset.refpick); renderRef(); say('Unlocked. Your free song is in the files below.'); });
  if (RF) { renderRef(); loadRef(); if (arriveTrack) { pick(tracks.indexOf(arriveTrack), false); } }
  root.addEventListener('click', e => {
    const go = e.target.closest('[data-djgo],[data-djfiles]'); if (!go) return;
    e.preventDefault(); const el = root.querySelector(go.getAttribute('href')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // ---- accordion: fold the four sections into tabs so the music comes first
  const ACC = [
    { id: 'share', sel: '#al-share', label: 'Share It', tease: (RF && RF.tease) || (pack.share && pack.share.tease) || 'Send a song, earn a free download. Seven friends, the whole album.' },
    { id: 'own', sel: '#al-own', label: (DN && DN.tabLabel) || 'Own It', tease: (DN && DN.tabTease) || 'Listening is free. Name your price for the files.' },
    { id: 'dj', sel: '#al-dj', label: (DJ && DJ.tabLabel) || 'DJ Request It', tease: (DJ && DJ.tabTease) || 'Working DJs: the full pack, free, in exchange for a hello.' },
    { id: 'about', sel: '.al-about', label: 'About The Album', tease: 'The story behind the record and how to listen to it.' },
  ];
  (function buildAcc() {
    const first = root.querySelector(ACC[0].sel); if (!first) return;
    const wrap = document.createElement('div'); wrap.className = 'al-accs'; first.parentNode.insertBefore(wrap, first);
    ACC.forEach((a, i) => {
      const el = root.querySelector(a.sel); if (!el) return;
      const sec = document.createElement('section'); sec.className = 'al-acc'; sec.dataset.acc = a.id;
      sec.innerHTML = `<button type="button" class="al-accbtn" aria-expanded="false"><span class="n">0${i + 1}</span><span class="t"><b>${esc(a.label)}</b><span>${esc(a.tease)}</span><span class="mini" hidden></span></span><span class="ch"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></button><div class="al-accbody"><div></div></div>`;
      sec.querySelector('.al-accbody > div').appendChild(el); wrap.appendChild(sec);
    });
    // the old "al-about" heading grid loses its outer spacing inside a panel
    wrap.addEventListener('click', e => { const b = e.target.closest('.al-accbtn'); if (!b) return; const sec = b.parentNode; openAcc(sec.dataset.acc, !sec.classList.contains('open')); });
  })();
  function openAcc(id, open = true, scroll = true) {
    root.querySelectorAll('.al-acc').forEach(sec => { const on = sec.dataset.acc === id && open; sec.classList.toggle('open', on); sec.querySelector('.al-accbtn').setAttribute('aria-expanded', on ? 'true' : 'false'); });
    if (open && scroll) { const sec = root.querySelector('.al-acc[data-acc="' + id + '"]'); if (sec) setTimeout(() => sec.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60); }
  }
  function refMini() {
    const m = root.querySelector('.al-acc[data-acc="share"] .mini'); if (!m || !RF || !myRef) return;
    const n = refN(refRows()), t2 = RF.tier2 || 7; m.hidden = false; m.innerHTML = `<i style="--w:${Math.min(100, n / t2 * 100)}%"></i>${n} OF ${t2} FRIENDS LISTENED`;
  }
  refMini();
  // open the tab the visit is about; otherwise everything stays folded
  if (arriveMsg) openAcc('share', true, false);
  else if (thanksMsg) openAcc('own', true, false);
  // anchors inside the page open their panel first
  root.addEventListener('click', e => { const a = e.target.closest('[data-djgo],[data-djfiles]'); if (!a) return; const h = a.getAttribute('href'); openAcc(h === '#al-dj' ? 'dj' : 'own', true, false); }, true);
  const _openSheetFiles = root.querySelector('#al-files');
  load(cur, 0, false);
}
mountAlbum(document.getElementById('app'), PACK);
</script>
